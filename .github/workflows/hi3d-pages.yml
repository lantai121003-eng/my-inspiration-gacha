name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Prepare static entry
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp _site/hi3d-my-capsules.html _site/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site
      - name: Wait for uploaded artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if matches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"${PAGES_ARTIFACT}\" and .expired == false) | .id")"; then
              count="$(printf '%s\n' "$matches" | awk 'NF { count++ } END { print count+0 }')"
              if [ "$count" -eq 1 ]; then
                echo "Artifact ${PAGES_ARTIFACT} is available for deployment."
                exit 0
              elif [ "$count" -gt 1 ]; then
                echo "::error::Multiple artifacts match ${PAGES_ARTIFACT}; deployment stopped."
                exit 1
              fi
            fi
            echo "Waiting for artifact metadata (${attempt}/12)."
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Artifact ${PAGES_ARTIFACT} did not become available; no deployment was started."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
